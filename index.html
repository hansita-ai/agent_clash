<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Clash</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #f5f5f5;
}

.screen {
    display: none;
    padding: 40px;
    max-width: 900px;
    margin: auto;
}

.active {
    display: block;
}

h1, h2 {
    text-align: center;
}

button {
    padding: 12px 24px;
    font-size: 16px;
    background: #ff9800;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #e68900;
}

.card {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 10px;
    margin: 15px 0;
}

input {
    padding: 6px;
    font-size: 14px;
}

.center {
    text-align: center;
    margin-top: 30px;
}

.bar {
    background: #333;
    border-radius: 10px;
    height: 16px;
    overflow: hidden;
    margin-bottom: 10px;
}

.fill {
    background: #4caf50;
    height: 100%;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
    <h1>AGENT CLASH</h1>
    <p style="text-align:center;">
        Competitive Resource Allocation Game
    </p>
    <div class="center">
        <button onclick="go('setup')">Play Now</button>
    </div>
</div>

<!-- SETUP -->
<div id="setup" class="screen">
    <h2>Game Setup</h2>
    <div class="card center">
        Players (1–5):
        <input type="number" id="players" min="1" max="5" value="2"><br><br>
        Rounds:
        <input type="number" id="rounds" min="1" max="10" value="5"><br><br>
        <button onclick="startGame()">Start Game</button>
    </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
    <h2 id="roundTitle"></h2>
    <form id="gameForm"></form>
    <div class="center">
        <button onclick="endRound()">End Round</button>
    </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
    <h2>Final Results</h2>
    <div id="resultsBox"></div>
    <div class="center">
        <button onclick="go('home')">Play Again</button>
    </div>
</div>

<script>
let numPlayers = 0;
let totalRounds = 0;
let currentRound = 1;
let resources = [];
let scores = [];
const multiplier = 1.5;

function go(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startGame() {
    numPlayers = parseInt(document.getElementById("players").value);
    totalRounds = parseInt(document.getElementById("rounds").value);

    resources = Array(numPlayers).fill(100);
    scores = Array(numPlayers).fill(0);
    currentRound = 1;

    renderRound();
    go('game');
}

function renderRound() {
    document.getElementById("roundTitle").innerText = "Round " + currentRound;
    const form = document.getElementById("gameForm");
    form.innerHTML = "";

    resources.forEach((r, i) => {
        form.innerHTML += `
        <div class="card">
            <strong>Player ${i + 1}</strong><br>
            Resources: ${r}
            <div class="bar">
                <div class="fill" style="width:${Math.min(r,200)/2}%"></div>
            </div>
            Contribute:
            <input type="number" min="0" max="${r}" value="0" id="p${i}">
        </div>
        `;
    });
}

function endRound() {
    let pool = 0;

    for (let i = 0; i < numPlayers; i++) {
        let c = parseInt(document.getElementById(`p${i}`).value);
        c = Math.min(c, resources[i]);
        resources[i] -= c;
        pool += c;
    }

    pool = Math.floor(pool * multiplier);
    let share = Math.floor(pool / numPlayers);

    for (let i = 0; i < numPlayers; i++) {
        resources[i] += share;
        scores[i] += resources[i];
    }

    currentRound++;

    if (currentRound > totalRounds) {
        showResults();
    } else {
        renderRound();
    }
}

function showResults() {
    const box = document.getElementById("resultsBox");
    box.innerHTML = "";

    let winner = scores.indexOf(Math.max(...scores)) + 1;

    scores.forEach((s, i) => {
        box.innerHTML += `<div class="card">Player ${i + 1}: ${s}</div>`;
    });

    box.innerHTML += `<h3 style="text-align:center;">🏆 Winner: Player ${winner}</h3>`;
    go('result');
}
</script>

</body>
</html>
